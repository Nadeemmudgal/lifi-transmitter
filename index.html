<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Li-Fi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #0b0f17;
      color: #f8fafc;
    }
    .box {
      width: 100%;
      max-width: 360px;
      padding: 28px 22px;
      background: #131a26;
      border: 1px solid #232f42;
      border-radius: 20px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    input, select, button {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid #283548;
    }
    input, select {
      background: #0b0f17;
      color: #ffffff;
    }
    button {
      background: #38bdf8;
      color: #0b0f17;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
    #screenStrobe {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>LI-FI</h2>
    <input type="text" id="messageInput" maxlength="32" placeholder="Type text, emoji, or 25*8=" />
    <select id="modeSelect">
      <option value="flash">Rear Flashlight</option>
      <option value="screen">Screen Flash</option>
    </select>
    <button id="sendBtn">Transmit</button>
    <p id="status">Ready</p>
  </div>
  <div id="screenStrobe"></div>
  <script src="app.js?v=9"></script>
</body>
</html>
