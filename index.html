<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';" />
  <title>Li-Fi Light Transmitter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 20px; background: #111; color: #f5f5f5; }
    input, select, button { width: 100%; padding: 14px; margin-top: 12px; font-size: 16px; border-radius: 8px; border: none; box-sizing: border-box; }
    input, select { background: #222; color: #fff; border: 1px solid #444; }
    button { background: #00c853; color: #000; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; color: #999; }
    #status { margin-top: 16px; font-size: 14px; color: #aaa; }
    #screenStrobe {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: #000; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px; color: #555;
    }
  </style>
</head>
<body>
  <h2>Li-Fi Light Transmitter</h2>
  <input type="text" id="messageInput" maxlength="32" placeholder="Enter message (max 32 chars)" />
  <select id="modeSelect">
    <option value="auto">Mode: Auto (Rear Flash + Screen Fallback)</option>
    <option value="flash">Mode: Rear Flashlight Only</option>
    <option value="screen">Mode: Screen Flash (Works on ALL Phones)</option>
  </select>
  <button id="sendBtn">Transmit Light Signal</button>
  <p id="status">Status: Ready (v2 Universal)</p>

  <div id="screenStrobe">Hold screen 1-2 inches from LDR sensor...</div>

  <script src="app.js?v=2"></script>
</body>
</html>
